<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas — Éditeur de monde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span>Wikinotopia</span>
    </div>
    <div class="global-search-wrap">
      <input type="text" id="globalSearch" class="global-search-input" placeholder="Personnage, lieu, événement, ...">
    </div>
    <div class="file-controls">
      <input type="file" id="fileInput" accept=".json" hidden>
      <!-- <button id="btnLoad">Charger un monde</button>
      <button id="btnNew">Nouveau monde</button>  
      <button id="btnSave" class="primary">Enregistrer</button>-->
      <button id="btnGithub">GitHub</button>
      <button id="btnRandom">Page aléatoire</button>
      <button id="btnCheck">Vérifier l'intégrité</button>
      <span id="fileStatus"></span>
      <span id="autosaveIndicator" class="autosave-indicator"></span>
    </div>
  </header>
  <div class="body-layout">
    <nav class="sidebar" id="sidebar"></nav>
    <section class="list-panel" id="listPanel"></section>
    <section class="detail-panel" id="detailPanel">
      <div class="detail-header" id="detailHeader"></div>
      <div class="detail-body-scroll" id="detailBody"></div>
    </section>
  </div>
</div>
<script type="module" src="wiki.js"></script>
</body>
</html>
