<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas — Frise chronologique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .tl-wrap{ display:flex; flex-direction:column; gap:28px; }
  .tl-axis-scroll{ overflow-x:auto; padding:10px 0 26px; }
  .tl-axis{ position:relative; min-width:1200px; height:150px; margin:40px 10px 0; border-top:2px solid var(--border); }
  .tl-tick{ position:absolute; top:-8px; width:1px; height:14px; background:var(--border); }
  .tl-tick-label{ position:absolute; top:10px; transform:translateX(-50%); font-family:var(--font-mono); font-size:.72rem; color:var(--text-muted); }
  .tl-marker{ position:absolute; width:11px; height:11px; border-radius:50%; background:var(--link); border:2px solid var(--content-bg); box-shadow:0 0 0 1px var(--border); cursor:pointer; transform:translate(-50%,-50%); }
  .tl-marker:hover{ background:var(--gold); z-index:5; }
  .tl-marker.marquant{ width:15px; height:15px; background:var(--gold); }
  .tl-marker.selected{ background:var(--danger); }
  .tl-lists{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .tl-list-col h3{ font-family:var(--font-heading); font-size:1rem; border-bottom:1px solid var(--border-light); padding-bottom:6px; }
  .tl-list-col ul{ list-style:none; padding:0; margin:0; }
  .tl-list-col li{ padding:5px 0; border-bottom:1px dashed var(--border-light); font-size:.86rem; }
  .tl-list-col button.link-like{ background:none; border:none; padding:0; color:var(--link); font-size:.86rem; cursor:pointer; text-align:left; }
  .tl-list-col button.link-like:hover{ text-decoration:underline; }
  .tl-detail{ border:1px solid var(--border-light); border-radius:4px; padding:18px 20px; background:var(--content-bg); min-height:80px; }
  .tl-detail h2{ font-family:var(--font-heading); margin:0 0 4px; font-size:1.3rem; }
  .tl-detail .tl-meta{ color:var(--text-muted); font-size:.8rem; margin-bottom:10px; }
  .tl-detail dl{ display:grid; grid-template-columns:120px 1fr; gap:6px 10px; margin:0; font-size:.86rem; }
  .tl-detail dt{ color:var(--text-muted); }
  .tl-detail dd{ margin:0; }
</style>
</head>
<body>
  <header class="tool-topbar">
    <div class="tool-brand">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="17" stroke="#D9B876" stroke-width="2"/>
        <path d="M20 6 L23 18 L20 20 L17 18 Z" fill="#D9B876"/>
        <path d="M20 34 L17 22 L20 20 L23 22 Z" fill="#FBF8EF" opacity=".5"/>
        <circle cx="20" cy="20" r="2.2" fill="#D9B876"/>
      </svg>
      <span>Atlas</span>
    </div>
    <nav class="tool-nav">
      <a href="index.html">Accueil</a>
      <a href="wiki.html">Éditeur</a>
      <a href="timeline.html" class="active">Frise</a>
      <a href="map.html">Carte</a>
    </nav>
    <div class="tool-controls">
      <input type="file" id="fileInput" accept=".json" hidden>
      <button id="btnLoad">Charger un monde</button>
      <button id="btnGithub">Charger depuis GitHub</button>
      <span id="fileStatus"></span>
    </div>
  </header>

  <div class="tool-body">
    <h1 style="font-family:var(--font-heading); font-weight:400; margin-bottom:4px;">Frise chronologique</h1>
    <p style="color:var(--text-muted); margin-top:0;">Tous les événements du monde, placés sur l'axe L.l. Clique un point pour voir le détail.</p>
    <div id="timelineRoot"></div>
  </div>

<script type="module" src="timeline.js"></script>
</body>
</html>
