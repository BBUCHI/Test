<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas — Carte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .map-layout{ display:flex; gap:24px; align-items:flex-start; }
  .map-scroll{ overflow:auto; max-width:100%; }
  .map-grid{ display:grid; grid-template-columns:34px repeat(10, 78px); grid-auto-rows:60px; gap:2px; }
  .map-corner{ }
  .map-colhead, .map-rowhead{ display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:.72rem; color:var(--text-muted); }
  .map-cell{
    border:1px solid var(--border-light); background:var(--content-bg); border-radius:2px; padding:4px 5px;
    display:flex; flex-direction:column; gap:2px; cursor:pointer; overflow:hidden; font-size:.68rem;
  }
  .map-cell:hover{ border-color:var(--gold); background:var(--sidebar-bg); }
  .map-cell.has-region{ background:#f4f8fb; }
  .map-cell.selected{ border-color:var(--danger); border-width:2px; }
  .map-cell .mc-name{ font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .map-cell .mc-lieux{ color:var(--link); font-size:.66rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .map-side{ flex-shrink:0; width:300px; }
  .map-detail{ border:1px solid var(--border-light); border-radius:4px; padding:16px 18px; background:var(--content-bg); min-height:80px; margin-bottom:20px; }
  .map-detail h2{ font-family:var(--font-heading); margin:0 0 4px; font-size:1.2rem; }
  .map-detail .md-meta{ color:var(--text-muted); font-size:.78rem; margin-bottom:10px; }
  .map-detail ul{ list-style:none; padding:0; margin:8px 0 0; }
  .map-detail li{ padding:3px 0; font-size:.84rem; }
  .map-detail button.link-like{ background:none; border:none; padding:0; color:var(--link); font-size:.84rem; cursor:pointer; text-align:left; }
  .map-detail button.link-like:hover{ text-decoration:underline; }
  .map-outside{ border:1px solid var(--border-light); border-radius:4px; padding:14px 16px; background:var(--content-bg); }
  .map-outside h3{ font-family:var(--font-heading); font-size:.95rem; margin:0 0 8px; }
</style>
</head>
<body>
  <header class="tool-topbar">
    <div class="tool-brand">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="17" stroke="#D9B876" stroke-width="2"/>
        <path d="M20 6 L23 18 L20 20 L17 18 Z" fill="#D9B876"/>
        <path d="M20 34 L17 22 L20 20 L23 22 Z" fill="#FBF8EF" opacity=".5"/>
        <circle cx="20" cy="20" r="2.2" fill="#D9B876"/>
      </svg>
      <span>Atlas</span>
    </div>
    <nav class="tool-nav">
      <a href="index.html">Accueil</a>
      <a href="wiki.html">Éditeur</a>
      <a href="timeline.html">Frise</a>
      <a href="map.html" class="active">Carte</a>
    </nav>
    <div class="tool-controls">
      <input type="file" id="fileInput" accept=".json" hidden>
      <button id="btnLoad">Charger un monde</button>
      <button id="btnGithub">Charger depuis GitHub</button>
      <span id="fileStatus"></span>
    </div>
  </header>

  <div class="tool-body">
    <h1 style="font-family:var(--font-heading); font-weight:400; margin-bottom:4px;">Carte</h1>
    <p style="color:var(--text-muted); margin-top:0;">Grille des régions (A–J × 1–14). Clique une case pour voir la région et ses lieux.</p>
    <div id="mapRoot"></div>
  </div>

<script type="module" src="map.js"></script>
</body>
</html>
