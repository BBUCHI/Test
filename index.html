<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikinotopia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#f6f6f6; --content-bg:#fff; --border:#a2a9b1; --border-light:#eaecf0;
    --text:#202122; --text-muted:#54595d; --link:#0645ad; --gold:#a8762b;
    --font-heading:'Fraunces',Georgia,serif; --font-body:'Source Serif 4',Georgia,serif;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page-bg); color:var(--text); font-family:var(--font-body); }
  .wrap{ max-width:720px; margin:0 auto; padding:60px 24px 100px; }
  h1{ font-family:var(--font-heading); font-weight:600; font-size:2.4rem; margin:0 0 6px; }
  .subtitle{ color:var(--text-muted); margin:0 0 40px; }
  .tools{ display:flex; flex-direction:column; gap:14px; }
  .tool-card{
    display:block; text-decoration:none; color:inherit; background:var(--content-bg);
    border:1px solid var(--border-light); border-radius:6px; padding:20px 22px;
    transition:border-color .15s;
  }
  .tool-card:hover{ border-color:var(--gold); }
  .tool-card h2{ font-family:var(--font-heading); font-size:1.3rem; margin:0 0 4px; color:var(--link); }
  .tool-card p{ margin:0; color:var(--text-muted); font-size:.95rem; line-height:1.5; }
  .tool-card.disabled{ opacity:.55; cursor:default; }
  .tool-card.disabled:hover{ border-color:var(--border-light); }
  .tag{ display:inline-block; font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--gold); border:1px solid var(--gold); border-radius:10px; padding:1px 8px; margin-left:8px; vertical-align:middle; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Wikinotopia</h1>
    <p class="subtitle">Choix de l'outil.</p>
    <div class="tools">
      <a class="tool-card" href="wiki.html">
        <h2>Wikinotopia</h2>
        <p>Wiki complet de l'univers.</p>
      </a>
      <div class="tool-card disabled">
        <h2>Frise chronologique <span class="tag">à venir</span></h2>
        <p>Visualiser tous les événements dans l'ordre.</p>
      </div>
      <div class="tool-card disabled">
        <h2>Carte interactive <span class="tag">à venir</span></h2>
        <p>Situer les lieux et régions sur une carte.</p>
      </div>
      <div class="tool-card disabled">
        <h2>Jeux <span class="tag">à venir</span></h2>
        <p>Wordle, Bingo, Top 10, etc...</p>
      </div>
    </div>
  </div>
</body>
</html>
